###############################################################################
# mediamtx configuration for pi-camera-car
# Flask app writes a fresh copy of this file whenever HLS/RTSP mode is started,
# substituting the current resolution/fps from settings.json.
# Do NOT hand-edit while the app is running — it will be overwritten.
###############################################################################

# ── API (used by Flask to check mediamtx health) ────────────────────────────
api: yes
apiAddress: 127.0.0.1:9997

# ── Protocols ────────────────────────────────────────────────────────────────
rtspAddress: :8554         # RTSP  → rtsp://<pi-ip>:8554/cam
hlsAddress: :8888          # HLS   → http://<pi-ip>:8888/cam/index.m3u8
webrtcAddress: :8889       # WebRTC (mediamtx native, not aiortc)
srtAddress: :8890
rtmpAddress: :1935

# ── HLS tuning ───────────────────────────────────────────────────────────────
hlsSegmentDuration: 1s     # 1-second segments = ~1s latency
hlsPartDuration: 200ms     # Low-Latency HLS part duration
hlsSegmentMaxSize: 50MB

# ── Logging ──────────────────────────────────────────────────────────────────
logLevel: warn             # reduce noise; change to 'info' to debug

# ── Stream paths ─────────────────────────────────────────────────────────────
paths:
  cam:
    # rpiCamera source uses rpicam-vid / hardware H.264 encoder directly.
    # Values below are REPLACED at runtime by Flask (see app.py configure_camera).
    source: rpiCamera
    rpiCameraWidth: 320
    rpiCameraHeight: 240
    rpiCameraFPS: 15
    rpiCameraIDR: 60           # keyframe every 60 frames (~4s at 15fps)
    rpiCameraBitrate: 300000   # 300 kbps — adjust via settings
    rpiCameraH264Profile: baseline
    rpiCameraH264Level: "3.1"
