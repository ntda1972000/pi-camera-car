<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RC Car — Live Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #212121;
      color: #ececec;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      gap: 16px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; color: #ececec; }
    #stream-box {
      border: 1px solid #3f3f3f;
      border-radius: 10px;
      overflow: hidden;
      max-width: 640px;
      width: 100%;
      background: #000;
    }
    #stream-box img,
    #stream-box video {
      width: 100%;
      display: block;
    }
    #stream-box video { display: none; }
    .info-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      font-size: 0.85rem;
      width: 100%;
      max-width: 640px;
    }
    .info-item { display: flex; gap: 6px; align-items: center; }
    .info-label { color: #8e8ea0; }
    .info-value { color: #10a37f; font-weight: 600; }
    .settings-link {
      display: inline-block;
      padding: 10px 22px;
      background: #10a37f;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .settings-link:hover { background: #0d8c6c; }
    footer { font-size: 0.75rem; color: #565869; }
  </style>
  <!-- hls.js for Low-Latency HLS playback (loaded only when needed) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
  <h1>RC Car Live View</h1>
  <div id="stream-box">
    <img id="stream-img" src="/video_feed" alt="Camera stream" />
    <video id="stream-video" autoplay muted playsinline></video>
  </div>
  <div class="info-bar">
    <div class="info-item">
      <span class="info-label">Resolution:</span>
      <span class="info-value">{{ resolution[0] }}×{{ resolution[1] }}</span>
    </div>
    <div class="info-item">
      <span class="info-label">FPS:</span>
      <span class="info-value">{{ fps }}</span>
    </div>
    <div class="info-item">
      <span class="info-label">Bitrate:</span>
      <span class="info-value">{{ bitrate_kbps }} kbps</span>
    </div>
    <div class="info-item">
      <span class="info-label">Data/hr:</span>
      <span class="info-value">{{ mb_per_hour }} MB</span>
    </div>
    <div class="info-item" id="batt-item"
         {% if battery_percent is none %}style="display:none"{% endif %}>
      <span class="info-label">Battery:</span>
      <span class="info-value" id="batt-value"
            style="color:{% if battery_percent is not none and battery_percent < 20 %}#f87171{% elif battery_percent is not none and battery_percent < 40 %}#f59e0b{% else %}#10a37f{% endif %}">
        {% if battery_percent is not none %}{{ battery_percent }}%{% endif %}
      </span>
    </div>
  </div>
  <a href="/login" class="settings-link">⚙️ Settings</a>
  <footer>MJPEG · Streaming over WiFi</footer>
  <script>
    const streamImg   = document.getElementById("stream-img");
    const streamVideo = document.getElementById("stream-video");
    let webrtcPc = null;
    let hlsPlayer = null;

    function startHLS(hlsUrl) {
      streamImg.style.display = "none";
      streamVideo.style.display = "block";
      if (typeof Hls !== "undefined" && Hls.isSupported()) {
        hlsPlayer = new Hls({ lowLatencyMode: true, backBufferLength: 2 });
        hlsPlayer.loadSource(hlsUrl);
        hlsPlayer.attachMedia(streamVideo);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => streamVideo.play().catch(() => {}));
      } else if (streamVideo.canPlayType("application/vnd.apple.mpegurl")) {
        // Safari native HLS
        streamVideo.src = hlsUrl;
        streamVideo.play().catch(() => {});
      } else {
        // Fallback to MJPEG
        streamImg.style.display = "block";
        streamVideo.style.display = "none";
      }
    }
    async function startWebRTC() {
      if (!window.RTCPeerConnection) return;
      try {
        webrtcPc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
        webrtcPc.ontrack = e => { if (e.streams && e.streams[0]) streamVideo.srcObject = e.streams[0]; };
        webrtcPc.addTransceiver("video", { direction: "recvonly" });
        const offer = await webrtcPc.createOffer();
        await webrtcPc.setLocalDescription(offer);
        await new Promise(resolve => {
          if (webrtcPc.iceGatheringState === "complete") { resolve(); return; }
          const t = setTimeout(resolve, 5000);
          webrtcPc.addEventListener("icegatheringstatechange", () => {
            if (webrtcPc.iceGatheringState === "complete") { clearTimeout(t); resolve(); }
          });
        });
        const resp = await fetch("/api/webrtc/offer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sdp: webrtcPc.localDescription.sdp, type: webrtcPc.localDescription.type })
        });
        if (!resp.ok) throw new Error("status " + resp.status);
        await webrtcPc.setRemoteDescription(await resp.json());
        streamVideo.style.display = "block";
        streamImg.style.display = "none";
      } catch (e) {
        console.warn("WebRTC unavailable, using MJPEG:", e);
        if (webrtcPc) { webrtcPc.close(); webrtcPc = null; }
      }
    }

    // Only start WebRTC/HLS if server has it configured
    fetch("/api/status").then(r => r.json()).then(s => {
      if (s.stream_mode === "webrtc") startWebRTC();
      else if (s.stream_mode === "hls" && s.hls_url) startHLS(s.hls_url);
    }).catch(() => {});

    function pollBattery() {
      fetch("/api/status")
        .then(r => r.json())
        .then(data => {
          const pct  = data.battery_percent;
          const item = document.getElementById("batt-item");
          const val  = document.getElementById("batt-value");
          if (pct !== null && pct !== undefined) {
            item.style.display = "";
            val.textContent = pct + "%";
            val.style.color = pct < 20 ? "#f87171" : pct < 40 ? "#f59e0b" : "#10a37f";
          }
        }).catch(() => {});
    }
    pollBattery();
    setInterval(pollBattery, 30000);
  </script>
</body>
</html>
